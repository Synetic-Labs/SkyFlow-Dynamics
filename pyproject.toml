[project]
name = "skyflow-dynamics"
version = "0.1.0"
description = "Framework-agnostic symbolic specification of multirotor UAV dynamics: the math as SymPy source of truth, property-tested for physical correctness and golden-tested for authenticity against reference simulators."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "sympy>=1.12",
    "numpy>=1.26",
]

[project.optional-dependencies]
# The generated JAX backend (backends/jax.py). The core spec stays framework-free.
jax = [
    "jax>=0.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "jax>=0.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["properties"]
